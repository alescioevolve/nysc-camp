<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A5C36">
<title>Camp Admin · Camp Companion</title>
<script>try{var t=localStorage.getItem("camp-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<script>if(!/\/$/.test(location.pathname))location.replace(location.pathname+"/"+location.search+location.hash)</script>
<link rel="icon" type="image/png" sizes="48x48" href="../icons/camp-admin-48.png">
<link rel="icon" type="image/png" sizes="96x96" href="../icons/camp-admin-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/camp-admin-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/camp-admin-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Camp Admin">
<style>
@font-face{font-family:Inter;src:url(../fonts/inter-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(../fonts/inter-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Inter;src:url(../fonts/inter-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:Inter;src:url(../fonts/inter-700.woff2) format("woff2");font-weight:700;font-display:swap}
:root{
  --bg:#F6F4EE;--surface:#FFFFFF;--ink:#14231B;--muted:#535C55;--faint:#68716A;--line:#E2DED2;
  --green:#0A5C36;--green-2:#0B6B3E;--green-soft:#E6F0EA;--khaki:#6E531D;--khaki-soft:#F3ECDD;
  --alert:#963B19;--alert-soft:#F8EAE2;--radius:18px;--barbg:rgba(255,255,255,.96);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0C1310;--surface:#131C17;--ink:#EEF1EC;--muted:#A8B1A9;--faint:#879188;--line:#24302A;--green:#0F5E39;--green-2:#5BCB8E;--green-soft:#163024;--khaki:#DCC28A;--khaki-soft:#29251A;--alert:#F0A27C;--alert-soft:#33211A;--barbg:rgba(19,28,23,.96)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0C1310;--surface:#131C17;--ink:#EEF1EC;--muted:#A8B1A9;--faint:#879188;--line:#24302A;--green:#0F5E39;--green-2:#5BCB8E;--green-soft:#163024;--khaki:#DCC28A;--khaki-soft:#29251A;--alert:#F0A27C;--alert-soft:#33211A;--barbg:rgba(19,28,23,.96)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.stripe{height:4px;display:flex;background:var(--green)}.stripe i{flex:1;background:var(--green)}.stripe i:nth-child(2){background:#fff}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 0}

header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand img{width:36px;height:auto}
.brand h1{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.brand p{font-size:12.5px;color:var(--muted)}
.conn{display:none;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--khaki-soft);color:var(--khaki);white-space:nowrap}
.conn.ok{background:var(--green-soft);color:var(--green-2)}
.open-app{font-size:13px;font-weight:600;color:var(--green-2);text-decoration:none;white-space:nowrap}

.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:2px 16px 4px;position:sticky;top:0;z-index:5;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:42px;padding:0 15px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--alert);margin-left:6px;vertical-align:2px}

.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:2px 16px 4px}
.days::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;width:50px;min-height:52px;border:1px solid var(--line);background:var(--surface);border-radius:13px;text-align:center;cursor:pointer;position:relative}
.chip small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip b{display:block;font-size:17px;font-weight:700}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}.chip.on small{color:#D7E9DE}
.chip.ch::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--alert)}

h2{font-size:19px;font-weight:700;letter-spacing:-.015em;margin:4px 2px 2px}
.sub{font-size:13.5px;color:var(--muted);margin:0 2px 12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
input,select,textarea{min-width:0;max-width:100%}
.row3{display:grid;grid-template-columns:1.1fr .75fr 1.35fr;gap:8px}
.row,.row3{margin-top:8px}
.row>label.f,.row3>label.f{margin-top:0}
.card>.row:nth-child(2),.card>.row3:nth-child(2){margin-top:0}
label.f{display:block;margin-top:8px}
label.f:first-child{margin-top:0}
label.f span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px 2px}
input[type=text],input[type=time],input[type=date],input[type=password],input[type=number],select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:11px;background:var(--bg);padding:9px 11px;font-size:15.5px;outline:none}
textarea{min-height:72px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{border-color:var(--green-2);background:var(--surface);box-shadow:0 0 0 3px var(--green-soft)}
.bad input,.bad{border-color:var(--alert)!important}
.warn{font-size:12.5px;font-weight:600;color:var(--alert);margin-top:6px}
.it-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.it-head b{font-size:13px;color:var(--muted);font-weight:600}
.del{background:none;border:0;color:var(--alert);font-size:13px;font-weight:600;min-height:36px;padding:0 4px;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:13px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.full{width:100%}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.check{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:15px;font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--green)}
.meal-h{font-size:15px;font-weight:700;margin-bottom:4px}
.tip{font-size:13px;color:var(--muted);line-height:1.5}
.tip code{font-size:12.5px;background:var(--bg);padding:1px 5px;border-radius:5px}
.msg{border-radius:14px;padding:12px 14px;font-size:14px;font-weight:500;margin-bottom:12px}
.msg.ok{background:var(--green-soft);color:var(--green-2)}
.msg.err{background:var(--alert-soft);color:var(--alert)}
.msg.info{background:var(--khaki-soft);color:var(--khaki)}
.msg[hidden]{display:none}
.urgent-on{border-left:4px solid var(--alert)}
.hist a{color:var(--green-2);font-weight:600}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--barbg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar .st{flex:1;min-width:0;font-size:13.5px;font-weight:600;line-height:1.3}
.bar .st small{display:block;font-weight:500;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:18px 8px}
.res .side{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.res .side span{font-size:16px;font-weight:600;min-width:0}
.res .side input{width:84px;flex:0 0 auto;text-align:center;font-size:20px;font-weight:700}
.res label.f{margin-top:10px}
.more{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.more summary{font-size:14px;font-weight:600;color:var(--green-2);cursor:pointer;min-height:36px;display:flex;align-items:center}
.rs{display:block;font-size:12px;font-weight:600;color:var(--green-2);margin:4px 0 0 2px}
[hidden]{display:none!important}
.theme{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.theme svg{width:19px;height:19px}
.theme .sun{display:none}
:root[data-theme="dark"] .theme .sun{display:block}:root[data-theme="dark"] .theme .moon-i{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme .sun{display:block}:root:not([data-theme="light"]) .theme .moon-i{display:none}}
.login .theme{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px}
.hd-r{display:flex;align-items:center;gap:10px}

/* Sign-in */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px calc(28px + env(safe-area-inset-bottom));background:radial-gradient(500px 280px at 50% 0,rgba(10,92,54,.10),transparent),var(--bg)}
.lg{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px 22px 22px;box-shadow:0 18px 40px rgba(20,35,27,.08)}
.lg .top{text-align:center;margin-bottom:18px}
.lg .top img{width:58px;height:auto;margin-bottom:10px}
.lg h1{font-size:23px;font-weight:700;letter-spacing:-.02em}
.lg .top p{font-size:14.5px;color:var(--muted);margin-top:4px}
.lg label.f span{font-size:13px}
.pw{position:relative}
.pw input{padding-right:70px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);min-height:34px;padding:0 10px;border:0;border-radius:9px;background:transparent;color:var(--green-2);font-weight:700;font-size:13.5px;cursor:pointer}
.lg .btn.primary{margin-top:16px;width:100%;min-height:50px;font-size:16px}
.lg .help{text-align:center;font-size:13px;color:var(--muted);margin-top:14px;line-height:1.5}
.lg .msg{margin-bottom:14px}
.or{display:flex;align-items:center;gap:10px;margin:16px 0 12px;font-size:12.5px;color:var(--muted)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.lg a.btn{width:100%;min-height:48px}
.login .foot{margin-top:18px;font-size:12px;color:var(--muted);text-align:center}

/* Dashboard header + view switch */
.who{display:flex;align-items:center;gap:8px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:0 0 auto}
.who-t{text-align:right;line-height:1.25}
.who-t b{display:block;font-size:13.5px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.views{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.views button{min-height:40px;border:0;border-radius:10px;background:transparent;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.views button.on{background:var(--green);color:#fff}

/* Corps member view */
.pv-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.pv-bar select{min-height:38px;width:auto;font-size:13.5px;padding:6px 10px}
.pv{width:100%;height:calc(100vh - 250px);min-height:420px;border:1px solid var(--line);border-radius:22px;background:var(--bg);display:block;box-shadow:0 10px 26px rgba(20,35,27,.08)}

/* Account + activity */
.acct{display:flex;align-items:center;gap:12px}
.acct .avatar{width:46px;height:46px;font-size:17px}
.acct b{display:block;font-size:16px}
.acct>div>span{font-size:13px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.stack .btn{width:100%;white-space:nowrap}
.act{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0;padding-top:2px}
.act .avatar{width:32px;height:32px;font-size:12.5px}
.act b{font-size:14.5px}
.act p{font-size:13.5px;color:var(--muted);margin-top:1px;line-height:1.4}

/* Timetable: one line per item */
.tl-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.jump{flex:0 0 auto;min-height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;color:var(--green-2);cursor:pointer;margin-bottom:12px}
.tl{padding:4px 0;overflow:hidden}
.tl-row{display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:56px;padding:8px 12px 8px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;color:var(--ink)}
.tl-row:first-child{border-top:0}
.tl-row:active{background:var(--bg)}
.tl-row .tm{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.tl-row .tm small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.tl-row .nm{font-size:15px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tl-row .mt{display:block;font-size:12.5px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tl-row .rt{display:flex;align-items:center;gap:6px;color:var(--faint);font-size:18px}
.tl-row.past{opacity:.5}
.tl-row.now{background:var(--green-soft);box-shadow:inset 4px 0 0 var(--green-2)}
.pill{font-size:10.5px;font-weight:800;letter-spacing:.06em;padding:3px 7px;border-radius:99px;background:var(--green-2);color:var(--surface)}
.edot{width:9px;height:9px;border-radius:50%;background:var(--alert);flex:0 0 auto}
.tl-row.bad{box-shadow:inset 4px 0 0 var(--alert)}
.tl-row .wr{display:block;font-size:12px;font-weight:700;color:var(--alert);margin-top:2px}
.changes{font-size:13px;font-weight:600;color:var(--alert);margin:-4px 2px 10px}

/* Pop-up sheet, confirm dialog, undo toast */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,18,14,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
.scrim.center{align-items:center;padding:20px}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 10px}
.sheet h3,.dialog h3{font-size:18px;font-weight:700;letter-spacing:-.01em}
.sheet .sub{margin:2px 0 12px}
.sheet-f{display:flex;align-items:center;gap:8px;margin-top:16px}
.sheet-f .del{margin-right:auto;font-size:14.5px}
.dialog{width:100%;max-width:360px;background:var(--surface);border-radius:20px;padding:20px 18px 14px;animation:pop .15s ease-out}
.dialog p{font-size:14.5px;color:var(--muted);margin-top:6px;line-height:1.45}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.btn.danger{background:#B42318;border-color:#B42318;color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:30;width:calc(100% - 32px);max-width:480px;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:14px;padding:6px 6px 6px 16px;font-size:14.5px;font-weight:500;box-shadow:0 10px 26px rgba(0,0,0,.25);animation:up .2s ease-out}
.toast span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{min-height:42px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:#7FE0A8;font-weight:800;font-size:14.5px;cursor:pointer}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.toast{animation-name:tup}@keyframes tup{from{transform:translate(-50%,24px);opacity:0}}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:scale(.96);opacity:0}}
body.locked{overflow:hidden}
</style>
</head>
<body>
<!-- ═══ Sign in ═══ -->
<section class="login" id="login" hidden>
  <button class="theme" type="button" data-theme-toggle aria-label="Switch light or dark mode"><svg class="moon-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <form class="lg" id="lgform" autocomplete="on">
    <div class="top">
      <img src="../assets/nysc-logo.png" alt="" width="240" height="304">
      <h1>Camp Admin</h1>
      <p>Sign in to manage Camp Companion</p>
    </div>
    <div class="msg" id="lmsg" hidden></div>
    <label class="f"><span>Full name</span><input type="text" id="lname" name="username" autocomplete="username" autocapitalize="words" placeholder="e.g. Musa Adamu" required></label>
    <label class="f"><span>Access code</span><div class="pw"><input type="password" id="lcode" name="password" autocomplete="current-password" spellcheck="false" placeholder="Paste your access code" required><button type="button" id="lshow">Show</button></div></label>
    <label class="check"><input type="checkbox" id="lkeep" checked> Keep me signed in on this phone</label>
    <button class="btn primary" type="submit" id="signin">Sign in</button>
    <p class="help">Don't have an access code? Contact the Camp Companion administrator.</p>
    <div class="or"><span>or</span></div>
    <a class="btn full" href="../app/" id="tocorps">Open the corps member app</a>
  </form>
  <p class="foot">Camp Companion · Batch C · Stream I<br>Built by Alescio · Exeli Digital</p>
</section>

<!-- ═══ Dashboard ═══ -->
<div id="dash" hidden>
<div class="stripe"><i></i><i></i><i></i></div>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="../assets/nysc-logo.png" alt="" width="240" height="304">
      <div><h1>Camp Admin</h1><p>Batch C · Stream I</p></div>
    </div>
    <div class="hd-r"><button class="theme" type="button" data-theme-toggle aria-label="Switch light or dark mode"><svg class="moon-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button class="who" data-tab="acct" style="background:none;border:0;cursor:pointer;padding:0">
      <span class="who-t"><b id="whoname"></b><span class="conn" id="conn"></span><small id="whostate" style="font-size:12px;color:var(--muted)">Signed in</small></span>
      <span class="avatar" id="whoav"></span>
    </button></div>
  </header>

  <div class="views" role="tablist">
    <button data-view="dashboard" class="on">Admin dashboard</button>
    <button data-view="corps">Corps member view</button>
  </div>

  <div class="msg" id="msg" hidden></div>

  <div id="edit">
    <nav class="tabs" id="tabs">
      <button class="tab" data-tab="time">Timetable</button>
      <button class="tab" data-tab="notice">Announcements</button>
      <button class="tab" data-tab="fix">Fixtures &amp; results</button>
      <button class="tab" data-tab="menu">Menu</button>
      <button class="tab" data-tab="act">Activity</button>
      <button class="tab" data-tab="acct">Account</button>
    </nav>
    <main id="main"></main>
  </div>

  <div id="corps" hidden>
    <div class="pv-bar"><span>What corps members see</span>
      <select id="pvmode" aria-label="Version to show"><option value="live">Live version</option><option value="draft">With my unpublished changes</option></select></div>
    <iframe class="pv" id="pv" title="Corps member view" loading="lazy"></iframe>
  </div>
</div>

<div class="bar">
  <div class="in">
    <div class="st" id="status">No changes<small id="substatus"></small></div>
    <button class="btn ghost" id="discard" disabled>Discard</button>
    <button class="btn primary" id="publish" disabled>Publish</button>
  </div>
</div>
</div>

<script src="../data.js"></script>
<script>
const S = CAMP.SOURCE;
const API = `https://api.github.com/repos/${S.owner}/${S.repo}/contents/${S.path}`;
const WD = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MEALS = ["Breakfast","Lunch","Dinner"];
const SPORTS = ["Football","Volleyball","Badminton (singles)","Athletics"];
const STAGES = ["Round 1","Quarter-final","Semi-final","Third place","Final","Heats","Heats final"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const dO = k => new Date(k + "T12:00:00Z");
const wd = k => dO(k).getUTCDay();
const nice = k => `${WD[wd(k)].slice(0,3)} ${dO(k).getUTCDate()} ${MO[dO(k).getUTCMonth()]}`;
const clone = o => JSON.parse(JSON.stringify(o));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch (e) {} },
  del(k){ try { localStorage.removeItem(k); } catch (e) {} }
};
function lagosToday(){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:"Africa/Lagos",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}

/* ── State ── */
const sess = {
  get(k){ try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k,v){ try { sessionStorage.setItem(k,v); } catch (e) {} },
  del(k){ try { sessionStorage.removeItem(k); } catch (e) {} }
};
let token = store.get("camp-admin-token") || sess.get("camp-admin-token") || "";
let editor = store.get("camp-admin-name") || "";
let sha = null;                 // GitHub version of camp.json we are editing
let base = clone(CAMP.BUILT_IN); // last published copy
let work = clone(base);         // working copy
let tab = "time";
const DATES = Object.keys(base.days).sort();
let day = DATES.includes(lagosToday()) ? lagosToday() : DATES[0];
let fday = day;

/* ── UTF-8 safe base64 for the GitHub API ── */
function toB64(str){
  const bytes = new TextEncoder().encode(str); let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function fromB64(b64){
  const bin = atob(b64.replace(/\s/g,"")); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ── Messages ── */
function say(text, kind = "info", where = "#msg"){
  const m = $(where); m.textContent = text; m.className = "msg " + kind; m.hidden = !text;
  if (text) window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ── GitHub ── */
async function gh(method, body){
  const r = await fetch(API + (method === "GET" ? `?ref=${S.branch}&t=${Date.now()}` : ""), {
    method, cache: "no-store",
    headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28",
               ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  return r;
}
async function connect(){
  if (!token) { setConn(false); return "nokey"; }
  setConn(null);
  try {
    const r = await gh("GET");
    if (r.status === 401 || r.status === 403) { setConn(false); return "denied"; }
    if (r.status === 404) {
      sha = null; base = clone(CAMP.BUILT_IN);
      say("You're signed in. Nothing has been published yet, so you're starting from the official printed timetable.", "info");
    } else if (r.ok) {
      const j = await r.json(); sha = j.sha;
      const c = JSON.parse(fromB64(j.content));
      if (!CAMP.valid(c)) throw new Error("the saved schedule couldn't be read");
      base = c; say("", "info");
    } else throw new Error("server error " + r.status);
    const draft = JSON.parse(store.get("camp-admin-draft") || "null");
    if (draft && draft.sha === sha && CAMP.valid(draft.work) && JSON.stringify(draft.work) !== JSON.stringify(base)) {
      work = draft.work; say("Restored the unsaved changes you made earlier on this phone.", "info");
    } else { work = clone(base); store.del("camp-admin-draft"); }
    setConn(true); render(); refreshBar();
    return "ok";
  } catch (e) {
    setConn(false); return "offline";
  }
}
function setConn(ok){
  const st = $("#whostate"); if (!st) return;
  st.textContent = ok === null ? "Loading…" : ok ? "Signed in" : "Offline";
  st.style.color = ok === false ? "var(--alert)" : "var(--muted)";
}
function setWho(){
  $("#whoname").textContent = editor;
  $("#whoav").textContent = (editor.split(/\s+/).filter(Boolean).map(w => w[0]).join("").slice(0,2) || "A").toUpperCase();
}

/* ── Change tracking ── */
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function changes(){
  const out = [];
  const dd = DATES.filter(k => !same(work.days[k], base.days[k]));
  if (dd.length) out.push("timetable " + dd.map(nice).join(", "));
  if (!same(work.menu, base.menu)) out.push("menu");
  if (!same(work.fixtures, base.fixtures) || !same(work.bestLosers || {}, base.bestLosers || {})) out.push("results and fixtures");
  if (!same(work.announcements, base.announcements)) out.push("announcements");
  return out;
}
function refreshBar(){
  const ch = changes();
  $("#status").firstChild.nodeValue = ch.length ? `${ch.length} section${ch.length>1?"s":""} changed` : "No changes";
  $("#substatus").textContent = ch.length ? ch.join(" · ") : (base.updatedAt ? `Live since ${new Date(base.updatedAt).toLocaleString("en-GB",{timeZone:"Africa/Lagos",day:"numeric",month:"short",hour:"numeric",minute:"2-digit",hour12:true})}${base.updatedBy?" by "+base.updatedBy:""}` : "Showing the built-in timetable");
  $("#discard").disabled = !ch.length;
  $("#publish").disabled = !ch.length || !token || !editor;
  document.querySelectorAll(".tab").forEach(t => {
    const k = t.dataset.tab;
    const dirty = (k==="time" && ch.some(c=>c.startsWith("timetable"))) || (k==="menu" && ch.includes("menu")) || (k==="fix" && ch.includes("results and fixtures")) || (k==="notice" && ch.includes("announcements"));
    t.innerHTML = t.textContent.replace(/\s*$/,"") + (dirty ? '<span class="dot"></span>' : "");
    t.classList.toggle("on", k === tab);
  });
  if (ch.length) store.set("camp-admin-draft", JSON.stringify({ sha, work }));
  else store.del("camp-admin-draft");
}

/* ── Field binding: data-p="path" on every input ── */
function setPath(p, v){
  const [kind, a, b, c] = p.split("|");
  if (kind === "d") { const it = work.days[a][+b]; while (it.length <= +c) it.push(""); it[+c] = v; }
  if (kind === "m") work.menu[+a][+b] = v;
  if (kind === "f") {
    const f = work.fixtures[+a];
    f[b] = b === "no" ? (v === "" ? null : +v) : v;
    if (b === "sa" || b === "sb") {           // winner follows the scores unless it's a draw
      const x = f.sa, y = f.sb;
      if (x !== "" && y !== "" && x !== undefined && y !== undefined && +x !== +y) f.win = +x > +y ? "a" : "b";
      else if (x === "" && y === "") f.win = "";
      const sel = document.querySelector(`[data-p="f|${a}|win"]`); if (sel) sel.value = f.win || "";
    }
  }
  if (kind === "bl") { work.bestLosers = work.bestLosers || {}; const arr = work.bestLosers[a] = work.bestLosers[a] || ["","",""]; arr[+b] = v.trim(); }
  if (kind === "a") work.announcements[+a][b] = v;
}
document.addEventListener("input", e => {
  const p = e.target.dataset && e.target.dataset.p; if (!p) return;
  setPath(p, e.target.type === "checkbox" ? e.target.checked : e.target.value);
  if (p.startsWith("a|") && e.target.type === "checkbox") e.target.closest(".card").classList.toggle("urgent-on", e.target.checked);
  refreshBar();
});
document.addEventListener("change", e => {
  const p = e.target.dataset && e.target.dataset.p;
  if (p && p.startsWith("a|") && /\|(from|to|fromT|toT)$/.test(p)) render();   // refresh "Showing now / Scheduled"
});

/* ── Timetable ── */
const toM = t => { if (!/^\d\d:\d\d$/.test(t||"")) return NaN; const [h,m] = t.split(":").map(Number); return h*60+m; };
function sortDay(){ work.days[day].sort((x,y) => (x[0]||"").localeCompare(y[0]||"")); }
/* Problems with an item, given the items before it (sorted by start) */
/* An evening item may run past midnight (e.g. 10 PM to 1 AM). Anything else ending before it starts is a mistake. */
const overnight = it => CAMP.overnight(it[0] || "00:00", it[1] || "00:00");
const endM = it => toM(it[1]) + (overnight(it) ? 1440 : 0);
function timeProblem(it){
  const st = toM(it[0]), e = toM(it[1]);
  if (isNaN(st) || isNaN(e)) return "Set both start and end times.";
  if (e <= st && !overnight(it)) return "The end time must be after the start time. Events can only run past midnight if they start after 6 PM and end by 6 AM.";
  return "";
}
function issue(it, prevEnd){
  const st = toM(it[0]), e = endM(it);
  if (!String(it[2] || "").trim()) return "Needs a name.";
  const tp = timeProblem(it); if (tp) return tp.split(". ")[0] + ".";
  if (st < prevEnd) return "Overlaps the item before it.";
  return "";
}
const fmt12 = t => { const m = toM(t); if (isNaN(m)) return "--:--"; let h = Math.floor(m/60), ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return `${h}:${String(m%60).padStart(2,"0")} ${ap}`; };
function lagosMin(){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:"Africa/Lagos",hourCycle:"h23",hour:"2-digit",minute:"2-digit"}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return (+p.hour % 24) * 60 + (+p.minute);
}
function chips(sel, cur, fn, changed){
  return `<div class="days">${DATES.map(k => `<button class="chip ${k===cur?"on":""} ${changed(k)?"ch":""}" data-${sel}="${k}"><small>${WD[wd(k)].slice(0,3)}</small><b>${dO(k).getUTCDate()}</b></button>`).join("")}</div>`;
}
let jumpNow = true;   // scroll to the current item next time the timetable opens on today
function timeTab(){
  const items = work.days[day], was = base.days[day] || [];
  const isToday = day === lagosToday(), nowM = lagosMin();
  const seen = new Set(was.map(x => JSON.stringify(x)));
  const edited = items.filter(x => !seen.has(JSON.stringify(x))).length;
  const removed = Math.max(0, was.length - items.length);   // an edited item isn't counted as removed
  let prevEnd = -1, nowShown = false;
  const rows = items.map((it, i) => {
    const w = issue(it, prevEnd); const st = toM(it[0]), e = endM(it); if (!isNaN(e)) prevEnd = Math.max(prevEnd, e);
    const past = isToday && !isNaN(e) && e <= nowM, now = isToday && !nowShown && st <= nowM && nowM < e;
    if (now) nowShown = true;
    const ch = !seen.has(JSON.stringify(it));
    const meta = [it[4], it[3]].filter(Boolean).join(" · ");
    return `<button class="tl-row ${past?"past":""} ${now?"now":""} ${w?"bad":""}" data-edit="${i}" ${now?"data-now":""}>
      <span class="tm">${fmt12(it[0]).replace(/ (AM|PM)$/,"")}<small>${fmt12(it[1])}${overnight(it) ? " +1" : ""}</small></span>
      <span><span class="nm">${esc(it[2] || "Untitled item")}</span>${meta?`<span class="mt">${esc(meta)}</span>`:""}${w?`<span class="wr">${esc(w)}</span>`:""}</span>
      <span class="rt">${now?`<span class="pill">NOW</span>`:""}${ch?`<span class="edot" title="Changed since the last publish" aria-label="Changed"></span>`:""}›</span></button>`;
  }).join("");
  const chg = [edited && `${edited} edited`, removed && `${removed} removed`].filter(Boolean).join(" · ");
  return `${chips("day", day, null, k => !same(work.days[k], base.days[k]))}
    <div class="tl-top"><div><h2>${WD[wd(day)]}, ${dO(day).getUTCDate()} ${MO[dO(day).getUTCMonth()]}</h2>
      <p class="sub">${items.length} items · tap one to change it${edited || removed ? ` · <span style="color:var(--alert)">●</span> changed` : ""}</p></div>${isToday?`<button class="jump" data-jump>Jump to now</button>`:""}</div>
    ${chg ? `<p class="changes">${chg} since the last publish</p>` : ""}
    <div class="card tl">${rows || `<div class="empty">Nothing on this day yet.</div>`}</div>
    <button class="btn full" data-add-item>+ Add an item to ${nice(day)}</button>`;
}

/* ── Pop-up editor for one timetable item ── */
let sheetPushed = false;
function openSheet(html){
  closeOverlay("#sheet");
  const d = document.createElement("div"); d.className = "scrim"; d.id = "sheet";
  d.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(d); document.body.classList.add("locked");
  d.addEventListener("click", e => { if (e.target === d) closeSheet(); });
  history.pushState({ sheet: 1 }, ""); sheetPushed = true;
  return d;
}
function closeOverlay(sel){ const el = $(sel); if (el) el.remove(); if (!$(".scrim")) document.body.classList.remove("locked"); }
function closeSheet(fromBack){
  if (!$("#sheet")) return;
  closeOverlay("#sheet");
  if (sheetPushed && !fromBack) { sheetPushed = false; history.back(); } else sheetPushed = false;
}
window.addEventListener("popstate", () => { if ($("#confirm")) { closeOverlay("#confirm"); } if ($("#sheet")) closeSheet(true); });

function editItem(i){
  const isNew = i === null, items = work.days[day];
  const last = items[items.length - 1];
  const it = isNew ? [last ? last[1] : "09:00", "", "", "", ""] : items[i].slice();
  const d = openSheet(`<div class="grab"></div><h3>${isNew ? "New item" : "Change item"}</h3><p class="sub">${nice(day)}</p>
    <div class="row"><label class="f"><span>Starts</span><input type="time" id="e0" value="${esc(it[0])}"></label>
      <label class="f"><span>Ends</span><input type="time" id="e1" value="${esc(it[1])}"></label></div>
    <label class="f"><span>Activity</span><input type="text" id="e2" value="${esc(it[2])}" placeholder="e.g. Skills Acquisition Training"></label>
    <label class="f"><span>Venue (optional)</span><input type="text" id="e4" value="${esc(it[4] || "")}" placeholder="e.g. Parade Ground"></label>
    <label class="f"><span>Note (optional)</span><input type="text" id="e3" value="${esc(it[3] || "")}" placeholder="e.g. Theme, dress code or reminder"></label>
    <div class="warn" id="ew"></div>
    <div class="sheet-f">${isNew ? "" : `<button class="del" id="eremove">Remove</button>`}
      <button class="btn ghost" id="ecancel">Cancel</button><button class="btn primary" id="esave">${isNew ? "Add" : "Save"}</button></div>`);
  if (isNew) setTimeout(() => d.querySelector("#e2").focus(), 250);
  d.querySelector("#ecancel").onclick = () => closeSheet();
  d.querySelector("#esave").onclick = () => {
    const v = [0,1,2,3,4].map(k => d.querySelector("#e" + k).value.trim());
    const w = !v[2] ? "Give it a name." : timeProblem(v);
    if (w) { d.querySelector("#ew").textContent = w; return; }
    if (isNew) items.push(v); else items[i] = v;
    sortDay(); closeSheet(); render();
  };
  const rm = d.querySelector("#eremove");
  if (rm) rm.onclick = async () => {
    if (!(await ask(`Remove "${it[2] || "this item"}"?`, `It comes off ${nice(day)} once you publish. You can undo straight after.`, "Remove"))) return;
    const k = day, gone = items.splice(i, 1)[0]; closeSheet(); render();
    toast(`Removed ${gone[2] || "item"}`, () => { work.days[k].push(gone); const keep = day; day = k; sortDay(); day = keep; render(); });
  };
}

/* ── Confirm dialog and undo toast ── */
function ask(title, body, ok = "Remove", danger = true){
  return new Promise(res => {
    closeOverlay("#confirm");
    const d = document.createElement("div"); d.className = "scrim center"; d.id = "confirm";
    d.innerHTML = `<div class="dialog" role="alertdialog" aria-modal="true"><h3>${esc(title)}</h3>${body ? `<p>${esc(body)}</p>` : ""}
      <div class="acts"><button class="btn ghost" data-no>Cancel</button><button class="btn ${danger ? "danger" : "primary"}" data-yes>${esc(ok)}</button></div></div>`;
    document.body.appendChild(d); document.body.classList.add("locked");
    const done = v => { closeOverlay("#confirm"); res(v); };
    d.addEventListener("click", e => { if (e.target === d || e.target.closest("[data-no]")) done(false); else if (e.target.closest("[data-yes]")) done(true); });
    d.querySelector("[data-yes]").focus();
  });
}
let toastTimer = null;
function toast(text, undo){
  const old = $("#toast"); if (old) old.remove(); clearTimeout(toastTimer);
  const t = document.createElement("div"); t.className = "toast"; t.id = "toast"; t.setAttribute("role", "status");
  t.innerHTML = `<span>${esc(text)}</span>${undo ? `<button>Undo</button>` : ""}`;
  document.body.appendChild(t);
  if (undo) t.querySelector("button").onclick = () => { t.remove(); clearTimeout(toastTimer); undo(); };
  toastTimer = setTimeout(() => t.remove(), 7000);
}

/* ── Menu ── */
function menuTab(){
  return `<h2>Weekly menu</h2><p class="sub">The same menu repeats every week. Each day of camp uses its weekday's row.</p>
    ${WD.map((name, w) => `<div class="card"><div class="meal-h">${name}</div>
      ${MEALS.map((m, i) => `<label class="f"><span>${m}</span><input type="text" value="${esc(work.menu[w][i])}" data-p="m|${w}|${i}"></label>`).join("")}
    </div>`).join("")}`;
}

/* ── Fixtures ── */
/* Same rules as the app: "W3" = winner of match 3, "L10" = loser of match 10, "BL1" = best loser 1 */
function resolveW(sport, tok, depth = 0){
  tok = String(tok ?? "").trim();
  if (!tok) return "TBD";
  if (/^\d+$/.test(tok)) return `Platoon ${tok}`;
  const m = tok.match(/^(W|L)(\d+)$/i);
  if (m && depth < 6) {
    const g = work.fixtures.find(x => x.sport === sport && x.no === +m[2]);
    if (g && (g.win === "a" || g.win === "b")) { const w = m[1].toUpperCase() === "W"; return resolveW(sport, g[w ? g.win : (g.win === "a" ? "b" : "a")], depth + 1); }
    return `${m[1].toUpperCase() === "W" ? "Winner" : "Loser"} #${m[2]} (not played yet)`;
  }
  const b = tok.match(/^BL(\d+)$/i);
  if (b) { const v = ((work.bestLosers || {})[sport] || [])[+b[1] - 1]; return v ? resolveW(sport, v, depth + 1) : `Best loser ${b[1]} (not set)`; }
  return tok;
}
function fixTab(){
  work.bestLosers = work.bestLosers || {};
  const list = work.fixtures.map((f, i) => ({ f, i })).filter(x => x.f.d === fday).sort((x,y) => (x.f.t||"").localeCompare(y.f.t||""));
  const opt = (arr, v) => arr.map(o => `<option ${o===v?"selected":""}>${esc(o)}</option>`).join("") + (arr.includes(v) || !v ? "" : `<option selected>${esc(v)}</option>`);
  const hint = (f, side) => { const tok = String(f[side] || ""); return /^\d+$/.test(tok) || !tok ? "" : `<small class="rs" data-rs="${side}">→ ${esc(resolveW(f.sport, tok))}</small>`; };
  return `${chips("fday", fday, null, k => !same(work.fixtures.filter(f=>f.d===k), base.fixtures.filter(f=>f.d===k)))}
    <h2>Fixtures · ${nice(fday)}</h2>
    <p class="sub">After a match, enter both scores. The winner is picked from the scores. For a draw decided on penalties, choose the winner yourself. Later rounds fill in automatically.</p>
    ${list.length ? "" : `<div class="card empty">No fixtures on this day.</div>`}
    ${list.map(({ f, i }) => `<div class="card" data-fix="${i}">
      <div class="it-head"><b>${esc(f.sport)}${f.no?` · Match #${f.no}`:""} · ${esc(f.stage)}</b><button class="del" data-del-fix="${i}">Remove</button></div>
      ${f.a !== "" || f.sport !== "Athletics" ? `
      <div class="res">
        <div class="side"><span>${esc(resolveW(f.sport, f.a))}</span><input type="number" inputmode="numeric" min="0" value="${esc(f.sa ?? "")}" data-p="f|${i}|sa" placeholder="–" aria-label="Score for side A"></div>
        <div class="side"><span>${esc(resolveW(f.sport, f.b))}</span><input type="number" inputmode="numeric" min="0" value="${esc(f.sb ?? "")}" data-p="f|${i}|sb" placeholder="–" aria-label="Score for side B"></div>
        <label class="f"><span>Winner</span><select data-p="f|${i}|win">
          <option value="" ${!f.win?"selected":""}>Not played yet</option>
          <option value="a" ${f.win==="a"?"selected":""}>${esc(resolveW(f.sport, f.a))}</option>
          <option value="b" ${f.win==="b"?"selected":""}>${esc(resolveW(f.sport, f.b))}</option></select></label>
      </div>` : ""}
      <details class="more"><summary>Edit fixture details</summary>
        <div class="row"><label class="f"><span>Sport</span><select data-p="f|${i}|sport">${opt(SPORTS, f.sport)}</select></label>
          <label class="f"><span>Stage</span><select data-p="f|${i}|stage">${opt(STAGES, f.stage)}</select></label></div>
        <div class="row"><label class="f"><span>Date</span><input type="date" value="${esc(f.d)}" min="${DATES[0]}" max="${DATES[DATES.length-1]}" data-p="f|${i}|d"></label>
          <label class="f"><span>Time</span><input type="time" value="${esc(f.t)}" data-p="f|${i}|t"></label></div>
        <div class="row"><label class="f"><span>Side A</span><input type="text" value="${esc(f.a)}" data-p="f|${i}|a" placeholder="5, W1, L10 or BL2">${hint(f,"a")}</label>
          <label class="f"><span>Side B</span><input type="text" value="${esc(f.b)}" data-p="f|${i}|b" placeholder="5, W1, L10 or BL2">${hint(f,"b")}</label></div>
        <div class="row"><label class="f"><span>Match #</span><input type="number" inputmode="numeric" value="${f.no ?? ""}" data-p="f|${i}|no"></label>
          <label class="f"><span>Note (optional)</span><input type="text" value="${esc(f.note)}" data-p="f|${i}|note"></label></div>
      </details>
    </div>`).join("")}
    <button class="btn full" data-add-fix>+ Add a fixture on ${nice(fday)}</button>
    <h2 style="margin-top:22px">Best losers</h2>
    <p class="sub">Some quarter-finals use the best Round 1 losers. Enter their platoon numbers once Round 1 ends.</p>
    ${SPORTS.filter(sp => sp !== "Athletics").map(sp => `<div class="card"><div class="meal-h">${esc(sp)}</div>
      <div class="row3" style="grid-template-columns:1fr 1fr 1fr">${[0,1,2].map(j => `<label class="f"><span>Best loser ${j+1}</span><input type="text" inputmode="numeric" value="${esc(((work.bestLosers[sp]||[])[j])||"")}" data-p="bl|${sp}|${j}" placeholder="e.g. 4"></label>`).join("")}</div></div>`).join("")}`;
}

/* ── Announcements ── */
const SIGNS = ["Camp Management","Camp Director","Deputy Camp Director","State Coordinator","Sports Committee"];
function noticeState(a){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:"Africa/Lagos",hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  const t = `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}`;
  const st = `${a.from} ${a.fromT || "00:00"}`, en = `${a.to || a.from} ${a.toT || "24:00"}`;
  return t < st ? "Scheduled" : t >= en ? "Ended" : "Showing now";
}
function noticeTab(){
  const list = work.announcements.map((a, i) => ({ a, i })).sort((x,y) => (y.a.postedAt||"").localeCompare(x.a.postedAt||""));
  const opt = v => SIGNS.concat(SIGNS.includes(v) || !v ? [] : [v]).map(o => `<option ${o === (v || "Camp Management") ? "selected" : ""}>${esc(o)}</option>`).join("");
  return `<h2>Announcements</h2><p class="sub">Shown on every corps member's app from the start to the end time. Leave the times empty to show all day. Urgent ones show in red above everything else and can't be dismissed.</p>
    <button class="btn full primary" data-add-notice style="margin-bottom:12px">+ New announcement</button>
    ${list.length ? "" : `<div class="card empty">No announcements yet.</div>`}
    ${list.map(({ a, i }) => `<div class="card ${a.urgent?"urgent-on":""}">
      <div class="it-head"><b>${noticeState(a)}${a.by?` · by ${esc(a.by)}`:""}</b><button class="del" data-del-notice="${i}">Delete</button></div>
      <label class="f"><span>Title</span><input type="text" value="${esc(a.title)}" data-p="a|${i}|title" placeholder="e.g. Lecture moved to the Auditorium"></label>
      <label class="f"><span>Message</span><textarea data-p="a|${i}|body" placeholder="Details corps members need to know">${esc(a.body)}</textarea></label>
      <label class="f"><span>Posted as</span><select data-p="a|${i}|sign">${opt(a.sign)}</select></label>
      <div class="row"><label class="f"><span>Starts</span><input type="date" value="${esc(a.from)}" data-p="a|${i}|from"></label>
        <label class="f"><span>at (optional)</span><input type="time" value="${esc(a.fromT || "")}" data-p="a|${i}|fromT"></label></div>
      <div class="row"><label class="f"><span>Ends</span><input type="date" value="${esc(a.to)}" data-p="a|${i}|to"></label>
        <label class="f"><span>at (optional)</span><input type="time" value="${esc(a.toT || "")}" data-p="a|${i}|toT"></label></div>
      <label class="check"><input type="checkbox" ${a.urgent?"checked":""} data-p="a|${i}|urgent"> Mark as urgent</label>
    </div>`).join("")}`;
}

/* ── Account ── */
function acctTab(){
  return `<h2>Account</h2><p class="sub">You're signed in on this phone.</p>
    <div class="card acct"><span class="avatar">${esc($("#whoav").textContent)}</span><div><b>${esc(editor)}</b><span>Your name appears on every update you publish.</span></div></div>
    <div class="card"><div class="meal-h">Latest version</div>
      <p class="tip">If another admin has published since you opened this page, load their version before you edit.</p>
      <div class="stack"><button class="btn" id="reload">Load the latest version</button></div></div>
    <div class="card"><div class="meal-h">Backup</div>
      <p class="tip">Keep a copy of everything on this phone, or restore a copy you saved earlier.</p>
      <div class="stack"><button class="btn" id="dl">Download a copy</button>
        <label class="btn">Restore from a copy<input type="file" id="ul" accept="application/json,.json" hidden></label></div></div>
    <div class="card"><div class="meal-h">Security</div>
      <p class="tip">Keep your access code private. If this phone is lost or someone else learns your code, contact the Camp Companion administrator to cancel it.</p>
      <div class="stack"><button class="btn" id="signout" style="color:var(--alert)">Sign out of this phone</button></div></div>`;
}

/* ── Activity: recent published updates ── */
let activity = null;
async function loadActivity(){
  try {
    const r = await fetch(`https://api.github.com/repos/${S.owner}/${S.repo}/commits?path=${S.path}&per_page=20&t=${Date.now()}`,
      { cache: "no-store", headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" } });
    if (!r.ok) throw 0;
    activity = (await r.json()).map(c => {
      const m = (c.commit.message || "").match(/^Update by (.+?): (.*)$/s);
      return { who: m ? m[1] : "Administrator", what: m ? m[2].split("\n")[0] : "Schedule set up", when: c.commit.author.date };
    });
  } catch (e) { activity = false; }
  if (tab === "act") render();
}
function actTab(){
  if (activity === null) { loadActivity(); return `<h2>Activity</h2><p class="sub">Loading recent updates…</p>`; }
  if (activity === false) return `<h2>Activity</h2><div class="card empty">Couldn't load recent updates. Check your network and try again.<div class="stack"><button class="btn" id="reload-act">Try again</button></div></div>`;
  const when = iso => new Date(iso).toLocaleString("en-GB",{timeZone:"Africa/Lagos",weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit",hour12:true});
  const ini = n => n.split(/\s+/).filter(Boolean).map(w => w[0]).join("").slice(0,2).toUpperCase();
  return `<h2>Activity</h2><p class="sub">Every published update, newest first.</p>
    <div class="card">${activity.length ? activity.map(a => `<div class="act"><span class="avatar">${esc(ini(a.who))}</span><div><b>${esc(a.who)}</b><p>${esc(a.what.replace(/;\s*/g, " · "))}<br>${esc(when(a.when))}</p></div></div>`).join("") : `<div class="empty">No updates published yet.</div>`}</div>`;
}

function render(){
  const m = $("#main");
  m.innerHTML = tab === "time" ? timeTab() : tab === "menu" ? menuTab() : tab === "fix" ? fixTab() : tab === "notice" ? noticeTab() : tab === "act" ? actTab() : acctTab();
  if (tab === "time") {
    const c = m.querySelector(".chip.on"); if (c) c.scrollIntoView({ inline: "center", block: "nearest" });
    if (jumpNow) { jumpNow = false; const r = m.querySelector("[data-now]"); if (r) setTimeout(() => r.scrollIntoView({ block: "center", behavior: "smooth" }), 60); }
  }
  if (tab === "fix") { const c = m.querySelector(".chip.on"); if (c) c.scrollIntoView({ inline: "center", block: "nearest" }); }
  refreshBar();
}

/* ── Clicks ── */
document.addEventListener("click", async e => {
  const t = e.target.closest("button, label.btn"); if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; if (tab === "time") jumpNow = true; if (view !== "dashboard") setView("dashboard"); render(); window.scrollTo({ top: 0 }); return; }
  if (t.dataset.day) { day = t.dataset.day; jumpNow = true; render(); return; }
  if (t.hasAttribute("data-jump")) { const r = $("[data-now]"); if (r) r.scrollIntoView({ block: "center", behavior: "smooth" }); else toast("Nothing is on right now."); return; }
  if (t.dataset.edit !== undefined) { editItem(+t.dataset.edit); return; }
  if (t.dataset.fday) { fday = t.dataset.fday; render(); return; }
  if (t.hasAttribute("data-add-item")) { editItem(null); return; }
  if (t.hasAttribute("data-add-fix")) { work.fixtures.push({ d: fday, t: "17:00", sport: "Football", no: null, stage: "Round 1", a: "", b: "", note: "", score: "" }); render(); return; }
  if (t.dataset.delFix !== undefined) {
    const i = +t.dataset.delFix, f = work.fixtures[i];
    if (!(await ask("Remove this fixture?", `${f.sport}${f.no ? " · Match #" + f.no : ""} on ${nice(f.d)}. You can undo straight after.`))) return;
    const gone = work.fixtures.splice(i, 1)[0]; render();
    toast("Fixture removed", () => { work.fixtures.splice(i, 0, gone); render(); }); return;
  }
  if (t.hasAttribute("data-add-notice")) {
    const today = DATES.includes(lagosToday()) ? lagosToday() : DATES[0];
    work.announcements.push({ id: "n" + Date.now(), title: "", body: "", urgent: false, sign: "Camp Management", from: today, fromT: "", to: today, toT: "", postedAt: new Date().toISOString(), by: editor });
    render(); document.querySelector('[data-p$="|title"]').focus(); return;
  }
  if (t.dataset.delNotice !== undefined) {
    const i = +t.dataset.delNotice, a = work.announcements[i];
    if (!(await ask("Delete this announcement?", `"${a.title || "Untitled"}" disappears from every phone once you publish. You can undo straight after.`, "Delete"))) return;
    const gone = work.announcements.splice(i, 1)[0]; render();
    toast("Announcement deleted", () => { work.announcements.splice(i, 0, gone); render(); }); return;
  }
  if (t.hasAttribute("data-theme-toggle")) {
    const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next); store.set("camp-theme", next);
    if (view === "corps") setView("corps");    // corps view follows the same theme
    return;
  }
  if (t.dataset.view) { setView(t.dataset.view); return; }
  if (t.id === "lshow") { const i = $("#lcode"); i.type = i.type === "password" ? "text" : "password"; t.textContent = i.type === "password" ? "Show" : "Hide"; return; }
  if (t.id === "reload") {
    if (changes().length && !(await ask("Load the latest version?", "Your unpublished changes on this phone will be replaced.", "Load latest"))) return;
    store.del("camp-admin-draft"); const r = await connect();
    if (r === "ok") say("You now have the latest version.", "ok"); else say("Couldn't load the latest version. Check your network and try again.", "err"); return;
  }
  if (t.id === "reload-act") { activity = null; render(); return; }
  if (t.id === "signout") {
    if (changes().length && !(await ask("Sign out anyway?", "You have unpublished changes. They stay saved on this phone.", "Sign out"))) return;
    token = ""; store.del("camp-admin-token"); sess.del("camp-admin-token"); location.hash = "#login"; route(); return;
  }
  if (t.id === "dl") {
    const blob = new Blob([JSON.stringify(work, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `camp-companion-copy-${lagosToday()}.json`; a.click(); return;
  }
  if (t.id === "discard") { if (await ask("Discard all unpublished changes?", "Everything goes back to what's live now.", "Discard")) { work = clone(base); store.del("camp-admin-draft"); render(); say("Changes discarded.", "info"); } return; }
  if (t.id === "publish") { publish(); return; }
});
document.addEventListener("change", e => {
  if (e.target.id !== "ul" || !e.target.files[0]) return;
  e.target.files[0].text().then(txt => {
    const c = JSON.parse(txt);
    if (!CAMP.valid(c)) throw new Error("bad file");
    work = c; render(); say("Copy restored. Check it, then tap Publish.", "ok");
  }).catch(() => say("That file isn't a Camp Companion copy.", "err"));
});

/* ── Publish ── */
/* Two admins publishing at once: GitHub refuses the second publish because it was based on an older copy.
   We then load the newer copy and combine: whatever only one admin changed is kept from that admin.
   Only where both changed the same thing (same day's timetable, same match, same announcement) does the
   newer published version win, and the admin is told exactly which parts to check. */
function combine(old, mine, theirs){
  const clashes = [], pick = (o, m, t, label) => {
    if (same(m, o)) return t; if (same(t, o) || same(m, t)) return m;
    clashes.push(label); return t;
  };
  const out = clone(theirs);
  const days = new Set([...Object.keys(old.days), ...Object.keys(mine.days), ...Object.keys(theirs.days)]);
  /* Within one day, combine item by item: take their list, drop what I removed or changed, add what I added or changed.
     Only if they also changed or removed an item I touched is it a real clash. */
  const mergeDay = (o = [], m = [], t = [], label) => {
    if (same(m, o)) return t; if (same(t, o) || same(m, t)) return m;
    const key = x => JSON.stringify(x), O = new Set(o.map(key)), M = new Set(m.map(key)), Tk = new Set(t.map(key));
    const rem = o.filter(x => !M.has(key(x))), add = m.filter(x => !O.has(key(x)));
    if (rem.some(x => !Tk.has(key(x)))) { clashes.push(label); return t; }
    const R = new Set(rem.map(key));
    return [...t.filter(x => !R.has(key(x))), ...add.filter(x => !Tk.has(key(x)))].sort((x, y) => (x[0] || "").localeCompare(y[0] || ""));
  };
  days.forEach(k => { const v = mergeDay(old.days[k], mine.days[k], theirs.days[k], `the same item on the ${nice(k)} timetable`); if (v && v.length) out.days[k] = clone(v); else if (theirs.days[k]) out.days[k] = []; });
  out.menu = theirs.menu.map((row, w) => clone(pick(old.menu[w], mine.menu[w], row, `the ${WD[w]} menu`)));
  if (old.fixtures.length === mine.fixtures.length && mine.fixtures.length === theirs.fixtures.length)
    out.fixtures = theirs.fixtures.map((f, i) => clone(pick(old.fixtures[i], mine.fixtures[i], f, `${f.sport} match #${f.no ?? i + 1}`)));
  else out.fixtures = clone(pick(old.fixtures, mine.fixtures, theirs.fixtures, "the fixtures list"));
  const bl = {}, sp = new Set([...Object.keys(old.bestLosers || {}), ...Object.keys(mine.bestLosers || {}), ...Object.keys(theirs.bestLosers || {})]);
  sp.forEach(k => { const v = pick((old.bestLosers || {})[k], (mine.bestLosers || {})[k], (theirs.bestLosers || {})[k], `${k} best losers`); if (v) bl[k] = clone(v); });
  out.bestLosers = bl;
  const by = list => Object.fromEntries((list || []).map(a => [a.id, a]));
  const O = by(old.announcements), M = by(mine.announcements), T = by(theirs.announcements);
  const ids = [...new Set([...(theirs.announcements || []), ...(mine.announcements || [])].map(a => a.id))];
  out.announcements = ids.map(id => pick(O[id], M[id], T[id], `the announcement "${(M[id] || T[id] || O[id]).title || "Untitled"}"`)).filter(Boolean).map(clone);
  return { merged: out, clashes };
}

async function publish(attempt = 0){
  const ch = changes();
  if (!ch.length || !token || !editor) return;
  const bad = DATES.find(k => work.days[k].some(it => !!timeProblem(it) || !String(it[2]).trim()));
  if (bad) { tab = "time"; day = bad; render(); say(`Fix the highlighted items on ${nice(bad)} first. Each needs a name and a start and end time.`, "err"); return; }
  const badN = work.announcements.find(a => !String(a.title || "").trim() || `${a.to || a.from} ${a.toT || "24:00"}` <= `${a.from} ${a.fromT || "00:00"}`);
  if (badN) { tab = "notice"; render(); say(`Check the announcement "${badN.title || "Untitled"}". It needs a title, and its end must be after its start.`, "err"); return; }
  const btn = $("#publish"); btn.disabled = true; btn.textContent = "Publishing…";
  const next = clone(work); next.updatedAt = new Date().toISOString(); next.updatedBy = editor;
  let retry = false;
  try {
    const r = await gh("PUT", { message: `Update by ${editor}: ${ch.join("; ")}`, content: toB64(JSON.stringify(next, null, 1)), branch: S.branch, ...(sha ? { sha } : {}) });
    if (r.status === 409 || r.status === 422) {
      /* Someone else published first. Load theirs and combine. */
      const g = await gh("GET"); if (!g.ok) throw new Error("reload " + g.status);
      const j = await g.json(); const theirs = JSON.parse(fromB64(j.content));
      if (!CAMP.valid(theirs)) throw new Error("bad copy");
      const { merged, clashes } = combine(base, work, theirs);
      const who = theirs.updatedBy && theirs.updatedBy !== editor ? theirs.updatedBy : "Another admin";
      base = theirs; sha = j.sha; work = merged; render();
      if (clashes.length) {
        say(`${who} published while you were editing. Your other changes have been combined with theirs, but you both changed ${clashes.join(", ")}. Their version is kept there. Check it, redo your change if it's still needed, then tap Publish.`, "err");
        return;
      }
      if (!changes().length) { say(`${who} published the same changes you made. Nothing else to publish.`, "ok"); return; }
      if (attempt < 2) { retry = true; return; }
      say(`${who} keeps publishing at the same time. Your changes are combined and kept here. Tap Publish again.`, "err"); return;
    }
    if (r.status === 401 || r.status === 403) { say("Your access code no longer works. It may have expired. Contact the Camp Companion administrator for a new one.", "err"); return; }
    if (!r.ok) throw new Error("server " + r.status);
    const j = await r.json(); sha = j.content.sha; base = next; work = clone(next);
    store.del("camp-admin-draft"); activity = null;
    fetch(CAMP.PURGE, { mode: "no-cors" }).catch(() => {});   // refresh the backup mirror too
    say(attempt ? "Published. Another admin published at the same time, so your changes were combined with theirs. Corps members will see both within about 2 minutes."
                : "Published. Corps members will see the update within about 2 minutes.", "ok");
  } catch (e) {
    say("Couldn't publish. Your changes are still on this phone. Check your network and try again.", "err");
  } finally { btn.textContent = "Publish"; refreshBar(); if (retry) publish(attempt + 1); }
}

window.addEventListener("beforeunload", e => { if (changes().length) { e.preventDefault(); e.returnValue = ""; } });

/* ── Views: sign in → dashboard, and the corps member view ── */
let view = "dashboard";
function setView(v){
  view = v;
  document.querySelectorAll("[data-view]").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  $("#edit").hidden = v !== "dashboard"; $("#corps").hidden = v !== "corps";
  if (v === "corps") {
    $("#pvmode").querySelector('[value="draft"]').disabled = !changes().length;
    if (!changes().length) $("#pvmode").value = "live";
    $("#pv").src = `../app/?preview=${$("#pvmode").value}&v=${Date.now()}`;
  }
  window.scrollTo({ top: 0 });
}
$("#pvmode").addEventListener("change", () => setView("corps"));

function route(){
  const signedIn = !!token && !!editor;
  if (!signedIn) {
    $("#dash").hidden = true; $("#login").hidden = false;
    $("#lname").value = editor; if (location.hash !== "#login") history.replaceState(null, "", "#login");
    return;
  }
  $("#login").hidden = true; $("#dash").hidden = false; setWho();
  if (location.hash !== "#dashboard") history.replaceState(null, "", "#dashboard");
}
window.addEventListener("hashchange", route);

$("#lgform").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("#lname").value.trim(), code = $("#lcode").value.trim();
  if (!name || !code) { say("Enter your full name and access code.", "err", "#lmsg"); return; }
  const btn = $("#signin"); btn.disabled = true; btn.textContent = "Signing in…"; say("", "info", "#lmsg");
  token = code; editor = name;
  const r = await connect();
  btn.disabled = false; btn.textContent = "Sign in";
  if (r !== "ok") {
    token = "";
    say(r === "denied" ? "That access code didn't work. Check it and try again, or contact the administrator for a new one."
                       : "Can't reach the server. Check your network and try again.", "err", "#lmsg");
    return;
  }
  store.set("camp-admin-name", editor);
  if ($("#lkeep").checked) { store.set("camp-admin-token", token); sess.del("camp-admin-token"); }
  else { sess.set("camp-admin-token", token); store.del("camp-admin-token"); }
  /* Ask Chrome to offer "Save password" (name + access code) */
  try {
    if (window.PasswordCredential && navigator.credentials) {
      await navigator.credentials.store(new PasswordCredential({ id: name, password: code, name }));
    }
  } catch (err) {}
  location.hash = "#dashboard"; route(); tab = "time"; render();
  setTimeout(() => { $("#lcode").value = ""; }, 1500);   // clear only after the browser has seen the sign-in
});

/* ── Installable as its own "Camp Admin" icon ── */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(() => {});

/* ── Start ── */
route();
if (token && editor) {
  render();
  connect().then(r => {
    if (r === "denied") { token = ""; store.del("camp-admin-token"); sess.del("camp-admin-token"); route(); say("Your access code no longer works. Contact the Camp Companion administrator for a new one.", "err", "#lmsg"); }
    else if (r === "offline") say("You're offline. You can keep editing, and publish when you have signal.", "info");
  });
}
</script>
