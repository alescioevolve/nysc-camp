<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A5C36">
<title>Camp Admin · Camp Companion</title>
<script>try{var t=localStorage.getItem("camp-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="icon" type="image/png" href="../icons/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Camp Admin">
<style>
@font-face{font-family:Inter;src:url(../fonts/inter-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(../fonts/inter-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Inter;src:url(../fonts/inter-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:Inter;src:url(../fonts/inter-700.woff2) format("woff2");font-weight:700;font-display:swap}
:root{
  --bg:#F6F4EE;--surface:#FFFFFF;--ink:#14231B;--muted:#535C55;--faint:#68716A;--line:#E2DED2;
  --green:#0A5C36;--green-2:#0B6B3E;--green-soft:#E6F0EA;--khaki:#6E531D;--khaki-soft:#F3ECDD;
  --alert:#963B19;--alert-soft:#F8EAE2;--radius:18px;--barbg:rgba(255,255,255,.96);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0C1310;--surface:#131C17;--ink:#EEF1EC;--muted:#A8B1A9;--faint:#879188;--line:#24302A;--green:#0F5E39;--green-2:#5BCB8E;--green-soft:#163024;--khaki:#DCC28A;--khaki-soft:#29251A;--alert:#F0A27C;--alert-soft:#33211A;--barbg:rgba(19,28,23,.96)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0C1310;--surface:#131C17;--ink:#EEF1EC;--muted:#A8B1A9;--faint:#879188;--line:#24302A;--green:#0F5E39;--green-2:#5BCB8E;--green-soft:#163024;--khaki:#DCC28A;--khaki-soft:#29251A;--alert:#F0A27C;--alert-soft:#33211A;--barbg:rgba(19,28,23,.96)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.stripe{height:4px;display:flex;background:var(--green)}.stripe i{flex:1;background:var(--green)}.stripe i:nth-child(2){background:#fff}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 0}

header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand img{width:36px;height:auto}
.brand h1{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.brand p{font-size:12.5px;color:var(--muted)}
.conn{display:none;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--khaki-soft);color:var(--khaki);white-space:nowrap}
.conn.ok{background:var(--green-soft);color:var(--green-2)}
.open-app{font-size:13px;font-weight:600;color:var(--green-2);text-decoration:none;white-space:nowrap}

.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:2px 16px 4px;position:sticky;top:0;z-index:5;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:42px;padding:0 15px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--alert);margin-left:6px;vertical-align:2px}

.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:2px 16px 4px}
.days::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;width:50px;min-height:52px;border:1px solid var(--line);background:var(--surface);border-radius:13px;text-align:center;cursor:pointer;position:relative}
.chip small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip b{display:block;font-size:17px;font-weight:700}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}.chip.on small{color:#D7E9DE}
.chip.ch::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--alert)}

h2{font-size:19px;font-weight:700;letter-spacing:-.015em;margin:4px 2px 2px}
.sub{font-size:13.5px;color:var(--muted);margin:0 2px 12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1.1fr .75fr 1.35fr;gap:8px}
.row,.row3{margin-top:8px}
.row>label.f,.row3>label.f{margin-top:0}
.card>.row:nth-child(2),.card>.row3:nth-child(2){margin-top:0}
label.f{display:block;margin-top:8px}
label.f:first-child{margin-top:0}
label.f span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px 2px}
input[type=text],input[type=time],input[type=date],input[type=password],input[type=number],select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:11px;background:var(--bg);padding:9px 11px;font-size:15.5px;outline:none}
textarea{min-height:72px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{border-color:var(--green-2);background:var(--surface);box-shadow:0 0 0 3px var(--green-soft)}
.bad input,.bad{border-color:var(--alert)!important}
.warn{font-size:12.5px;font-weight:600;color:var(--alert);margin-top:6px}
.it-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.it-head b{font-size:13px;color:var(--muted);font-weight:600}
.del{background:none;border:0;color:var(--alert);font-size:13px;font-weight:600;min-height:36px;padding:0 4px;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:13px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.full{width:100%}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.check{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:15px;font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--green)}
.meal-h{font-size:15px;font-weight:700;margin-bottom:4px}
.tip{font-size:13px;color:var(--muted);line-height:1.5}
.tip code{font-size:12.5px;background:var(--bg);padding:1px 5px;border-radius:5px}
.msg{border-radius:14px;padding:12px 14px;font-size:14px;font-weight:500;margin-bottom:12px}
.msg.ok{background:var(--green-soft);color:var(--green-2)}
.msg.err{background:var(--alert-soft);color:var(--alert)}
.msg.info{background:var(--khaki-soft);color:var(--khaki)}
.msg[hidden]{display:none}
.urgent-on{border-left:4px solid var(--alert)}
.hist a{color:var(--green-2);font-weight:600}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--barbg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar .st{flex:1;min-width:0;font-size:13.5px;font-weight:600;line-height:1.3}
.bar .st small{display:block;font-weight:500;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:18px 8px}
.res .side{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.res .side span{font-size:16px;font-weight:600;min-width:0}
.res .side input{width:84px;flex:0 0 auto;text-align:center;font-size:20px;font-weight:700}
.res label.f{margin-top:10px}
.more{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.more summary{font-size:14px;font-weight:600;color:var(--green-2);cursor:pointer;min-height:36px;display:flex;align-items:center}
.rs{display:block;font-size:12px;font-weight:600;color:var(--green-2);margin:4px 0 0 2px}
[hidden]{display:none!important}
.theme{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.theme svg{width:19px;height:19px}
.theme .sun{display:none}
:root[data-theme="dark"] .theme .sun{display:block}:root[data-theme="dark"] .theme .moon-i{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme .sun{display:block}:root:not([data-theme="light"]) .theme .moon-i{display:none}}
.login .theme{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px}
.hd-r{display:flex;align-items:center;gap:10px}

/* Sign-in */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px calc(28px + env(safe-area-inset-bottom));background:radial-gradient(500px 280px at 50% 0,rgba(10,92,54,.10),transparent),var(--bg)}
.lg{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px 22px 22px;box-shadow:0 18px 40px rgba(20,35,27,.08)}
.lg .top{text-align:center;margin-bottom:18px}
.lg .top img{width:58px;height:auto;margin-bottom:10px}
.lg h1{font-size:23px;font-weight:700;letter-spacing:-.02em}
.lg .top p{font-size:14.5px;color:var(--muted);margin-top:4px}
.lg label.f span{font-size:13px}
.pw{position:relative}
.pw input{padding-right:70px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);min-height:34px;padding:0 10px;border:0;border-radius:9px;background:transparent;color:var(--green-2);font-weight:700;font-size:13.5px;cursor:pointer}
.lg .btn.primary{margin-top:16px;width:100%;min-height:50px;font-size:16px}
.lg .help{text-align:center;font-size:13px;color:var(--muted);margin-top:14px;line-height:1.5}
.lg .msg{margin-bottom:14px}
.or{display:flex;align-items:center;gap:10px;margin:16px 0 12px;font-size:12.5px;color:var(--muted)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.lg a.btn{width:100%;min-height:48px}
.login .foot{margin-top:18px;font-size:12px;color:var(--muted);text-align:center}

/* Dashboard header + view switch */
.who{display:flex;align-items:center;gap:8px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:0 0 auto}
.who-t{text-align:right;line-height:1.25}
.who-t b{display:block;font-size:13.5px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.views{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.views button{min-height:40px;border:0;border-radius:10px;background:transparent;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.views button.on{background:var(--green);color:#fff}

/* Corps member view */
.pv-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.pv-bar select{min-height:38px;width:auto;font-size:13.5px;padding:6px 10px}
.pv{width:100%;height:calc(100vh - 250px);min-height:420px;border:1px solid var(--line);border-radius:22px;background:var(--bg);display:block;box-shadow:0 10px 26px rgba(20,35,27,.08)}

/* Account + activity */
.acct{display:flex;align-items:center;gap:12px}
.acct .avatar{width:46px;height:46px;font-size:17px}
.acct b{display:block;font-size:16px}
.acct>div>span{font-size:13px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.stack .btn{width:100%;white-space:nowrap}
.act{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0;padding-top:2px}
.act .avatar{width:32px;height:32px;font-size:12.5px}
.act b{font-size:14.5px}
.act p{font-size:13.5px;color:var(--muted);margin-top:1px;line-height:1.4}
</style>
</head>
<body>
<!-- ═══ Sign in ═══ -->
<section class="login" id="login" hidden>
  <button class="theme" type="button" data-theme-toggle aria-label="Switch light or dark mode"><svg class="moon-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <form class="lg" id="lgform" autocomplete="on">
    <div class="top">
      <img src="../assets/nysc-logo.png" alt="" width="240" height="304">
      <h1>Camp Admin</h1>
      <p>Sign in to manage Camp Companion</p>
    </div>
    <div class="msg" id="lmsg" hidden></div>
    <label class="f"><span>Full name</span><input type="text" id="lname" autocomplete="name" placeholder="e.g. Musa Adamu" required></label>
    <label class="f"><span>Access code</span><div class="pw"><input type="password" id="lcode" autocomplete="current-password" spellcheck="false" placeholder="Paste your access code" required><button type="button" id="lshow">Show</button></div></label>
    <label class="check"><input type="checkbox" id="lkeep" checked> Keep me signed in on this phone</label>
    <button class="btn primary" type="submit" id="signin">Sign in</button>
    <p class="help">Don't have an access code? Contact the Camp Companion administrator.</p>
    <div class="or"><span>or</span></div>
    <a class="btn full" href="../" id="tocorps">Open the corps member app</a>
  </form>
  <p class="foot">Camp Companion · Batch C · Stream I<br>Built by Alescio · Exeli Digital</p>
</section>

<!-- ═══ Dashboard ═══ -->
<div id="dash" hidden>
<div class="stripe"><i></i><i></i><i></i></div>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="../assets/nysc-logo.png" alt="" width="240" height="304">
      <div><h1>Camp Admin</h1><p>Batch C · Stream I</p></div>
    </div>
    <div class="hd-r"><button class="theme" type="button" data-theme-toggle aria-label="Switch light or dark mode"><svg class="moon-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button class="who" data-tab="acct" style="background:none;border:0;cursor:pointer;padding:0">
      <span class="who-t"><b id="whoname"></b><span class="conn" id="conn"></span><small id="whostate" style="font-size:12px;color:var(--muted)">Signed in</small></span>
      <span class="avatar" id="whoav"></span>
    </button></div>
  </header>

  <div class="views" role="tablist">
    <button data-view="dashboard" class="on">Admin dashboard</button>
    <button data-view="corps">Corps member view</button>
  </div>

  <div class="msg" id="msg" hidden></div>

  <div id="edit">
    <nav class="tabs" id="tabs">
      <button class="tab" data-tab="time">Timetable</button>
      <button class="tab" data-tab="notice">Announcements</button>
      <button class="tab" data-tab="fix">Fixtures &amp; results</button>
      <button class="tab" data-tab="menu">Menu</button>
      <button class="tab" data-tab="act">Activity</button>
      <button class="tab" data-tab="acct">Account</button>
    </nav>
    <main id="main"></main>
  </div>

  <div id="corps" hidden>
    <div class="pv-bar"><span>What corps members see</span>
      <select id="pvmode" aria-label="Version to show"><option value="live">Live version</option><option value="draft">With my unpublished changes</option></select></div>
    <iframe class="pv" id="pv" title="Corps member view" loading="lazy"></iframe>
  </div>
</div>

<div class="bar">
  <div class="in">
    <div class="st" id="status">No changes<small id="substatus"></small></div>
    <button class="btn ghost" id="discard" disabled>Discard</button>
    <button class="btn primary" id="publish" disabled>Publish</button>
  </div>
</div>
</div>

<script src="../data.js"></script>
<script>
const S = CAMP.SOURCE;
const API = `https://api.github.com/repos/${S.owner}/${S.repo}/contents/${S.path}`;
const WD = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MEALS = ["Breakfast","Lunch","Dinner"];
const SPORTS = ["Football","Volleyball","Badminton (singles)","Athletics"];
const STAGES = ["Round 1","Quarter-final","Semi-final","Third place","Final","Heats","Heats final"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const dO = k => new Date(k + "T12:00:00Z");
const wd = k => dO(k).getUTCDay();
const nice = k => `${WD[wd(k)].slice(0,3)} ${dO(k).getUTCDate()} ${MO[dO(k).getUTCMonth()]}`;
const clone = o => JSON.parse(JSON.stringify(o));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch (e) {} },
  del(k){ try { localStorage.removeItem(k); } catch (e) {} }
};
function lagosToday(){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:"Africa/Lagos",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}

/* ── State ── */
const sess = {
  get(k){ try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k,v){ try { sessionStorage.setItem(k,v); } catch (e) {} },
  del(k){ try { sessionStorage.removeItem(k); } catch (e) {} }
};
let token = store.get("camp-admin-token") || sess.get("camp-admin-token") || "";
let editor = store.get("camp-admin-name") || "";
let sha = null;                 // GitHub version of camp.json we are editing
let base = clone(CAMP.BUILT_IN); // last published copy
let work = clone(base);         // working copy
let tab = "time";
const DATES = Object.keys(base.days).sort();
let day = DATES.includes(lagosToday()) ? lagosToday() : DATES[0];
let fday = day;

/* ── UTF-8 safe base64 for the GitHub API ── */
function toB64(str){
  const bytes = new TextEncoder().encode(str); let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function fromB64(b64){
  const bin = atob(b64.replace(/\s/g,"")); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ── Messages ── */
function say(text, kind = "info", where = "#msg"){
  const m = $(where); m.textContent = text; m.className = "msg " + kind; m.hidden = !text;
  if (text) window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ── GitHub ── */
async function gh(method, body){
  const r = await fetch(API + (method === "GET" ? `?ref=${S.branch}&t=${Date.now()}` : ""), {
    method, cache: "no-store",
    headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28",
               ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  return r;
}
async function connect(){
  if (!token) { setConn(false); return "nokey"; }
  setConn(null);
  try {
    const r = await gh("GET");
    if (r.status === 401 || r.status === 403) { setConn(false); return "denied"; }
    if (r.status === 404) {
      sha = null; base = clone(CAMP.BUILT_IN);
      say("You're signed in. Nothing has been published yet, so you're starting from the official printed timetable.", "info");
    } else if (r.ok) {
      const j = await r.json(); sha = j.sha;
      const c = JSON.parse(fromB64(j.content));
      if (!CAMP.valid(c)) throw new Error("the saved schedule couldn't be read");
      base = c; say("", "info");
    } else throw new Error("server error " + r.status);
    const draft = JSON.parse(store.get("camp-admin-draft") || "null");
    if (draft && draft.sha === sha && CAMP.valid(draft.work) && JSON.stringify(draft.work) !== JSON.stringify(base)) {
      work = draft.work; say("Restored the unsaved changes you made earlier on this phone.", "info");
    } else { work = clone(base); store.del("camp-admin-draft"); }
    setConn(true); render(); refreshBar();
    return "ok";

    setConn(false); return "offline";
  }
}

/* ── Change tracking ── */
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function changes(){
  const out = [];
  const dd = DATES.filter(k => !same(work.days[k], base.days[k]));
  if (dd.length) out.push("timetable " + dd.map(nice).join(", "));
  if (!same(work.menu, base.menu)) out.push("menu");
  if (!same(work.fixtures, base.fixtures) || !same(work.bestLosers || {}, base.bestLosers || {})) out.push("results and fixtures");
  if (!same(work.announcements, base.announcements)) out.push("announcements");

}
function refreshBar(){

/* ── Field binding: data-p="path" on every input ── */
function setPath(p, v){
  const [kind, a, b, c] = p.split("|");
  if (kind === "d") { const it = work.days[a][+b]; while (it.length <= +c) it.push(""); it[+c] = v; }
  if (kind === "m") work.menu[+a][+b] = v;
  if (kind === "f") {
    const f = work.fixtures[+a];
    f[b] = b === "no" ? (v === "" ? null : +v) : v;
    if (b === "sa" || b === "sb") {           // winner follows the scores unless it's a draw
      const x = f.sa, y = f.sb;
      if (x !== "" && y !== "" && x !== undefined && y !== undefined && +x !== +y) f.win = +x > +y ? "a" : "b";
      else if (x === "" && y === "") f.win = "";
      const sel = document.querySelector(`[data-p="f|${a}|win"]`); if (sel) sel.value = f.win || "";
    }
  }
  if (kind === "bl") { work.bestLosers = work.bestLosers || {}; const arr = work.bestLosers[a] = work.bestLosers[a] || ["","",""]; arr[+b] = v.trim(); }
  if (kind === "a") work.announcements[+a][b] = v;
}
document.addEventListener("input", e => {
  const p = e.target.dataset && e.target.dataset.p; if (!p) return;
  setPath(p, e.target.type === "checkbox" ? e.target.checked : e.target.value);
  if (p.startsWith("d|")) validateDay();
  if (p.startsWith("a|") && e.target.type === "checkbox") e.target.closest(".card").classList.toggle("urgent-on", e.target.checked);

});

});

/* ── Timetable ── */
const toM = t => { if (!/^\d\d:\d\d$/.test(t||"")) return NaN; const [h,m] = t.split(":").map(Number); return h*60+m; };

function validateDay(){
  const items = work.days[day]; let prevEnd = -1;
  items.forEach((it, i) => {
    const card = document.querySelector(`[data-item="${i}"]`); if (!card) return;
    const s = toM(it[0]), e = toM(it[1]); const w = card.querySelector(".warn");
    let msg = "";
    if (isNaN(s) || isNaN(e)) msg = "Set both start and end times.";
    else if (e <= s) msg = "End time must be after the start time.";
    else if (s < prevEnd) msg = "Overlaps the item before it.";
    if (!isNaN(e)) prevEnd = Math.max(prevEnd, e);
    w.textContent = msg; card.classList.toggle("bad", !!msg);
  });
}

/* ── Fixtures ── */
/* Same rules as the app: "W3" = winner of match 3, "L10" = loser of match 10, "BL1" = best loser 1 */
function resolveW(sport, tok, depth = 0){
  tok = String(tok ?? "").trim();
  if (!tok) return "TBD";
  if (/^\d+$/.test(tok)) return `Platoon ${tok}`;
  const m = tok.match(/^(W|L)(\d+)$/i);
  if (m && depth < 6) {
    const g = work.fixtures.find(x => x.sport === sport && x.no === +m[2]);
    if (g && (g.win === "a" || g.win === "b")) { const w = m[1].toUpperCase() === "W"; return resolveW(sport, g[w ? g.win : (g.win === "a" ? "b" : "a")], depth + 1); }
    return `${m[1].toUpperCase() === "W" ? "Winner" : "Loser"} #${m[2]} (not played yet)`;
  }
  const b = tok.match(/^BL(\d+)$/i);
  if (b) { const v = ((work.bestLosers || {})[sport] || [])[+b[1] - 1]; return v ? resolveW(sport, v, depth + 1) : `Best loser ${b[1]} (not set)`; }
  return tok;
}

/* ── Activity: recent published updates ── */
let activity = null;
async function loadActivity(){
  try {
    const r = await fetch(`https://api.github.com/repos/${S.owner}/${S.repo}/commits?path=${S.path}&per_page=20&t=${Date.now()}`,
      { cache: "no-store", headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" } });
    if (!r.ok) throw 0;
    activity = (await r.json()).map(c => {
      const m = (c.commit.message || "").match(/^Update by (.+?): (.*)$/s);
      return { who: m ? m[1] : "Administrator", what: m ? m[2].split("\n")[0] : "Schedule set up", when: c.commit.author.date };
    });
  } catch (e) { activity = false; }

}

/* ── Publish ── */
async function publish(){
  const ch = changes();
  if (!ch.length || !token || !editor) return;
  const bad = DATES.find(k => work.days[k].some((it, i, a) => { const s = toM(it[0]), e = toM(it[1]); return isNaN(s) || isNaN(e) || e <= s || !String(it[2]).trim(); }));
  if (bad) { tab = "time"; day = bad; render(); say(`Fix the highlighted items on ${nice(bad)} first. Each needs a start, an end after it, and a name.`, "err"); return; }
  const btn = $("#publish"); btn.disabled = true; btn.textContent = "Publishing…";
  const next = clone(work); next.updatedAt = new Date().toISOString(); next.updatedBy = editor;
  try {
    const r = await gh("PUT", { message: `Update by ${editor}: ${ch.join("; ")}`, content: toB64(JSON.stringify(next, null, 1)), branch: S.branch, ...(sha ? { sha } : {}) });
    if (r.status === 409 || r.status === 422) { say("Another admin published while you were editing. Your changes are kept on this phone. Go to Account, load the latest version, then make your changes again.", "err"); return; }
    if (r.status === 401 || r.status === 403) { say("Your access code no longer works. It may have expired. Contact the Camp Companion administrator for a new one.", "err"); return; }
    if (!r.ok) throw new Error("server " + r.status);
    const j = await r.json(); sha = j.content.sha; base = next; work = clone(next);
    store.del("camp-admin-draft"); activity = null;
    fetch(CAMP.PURGE, { mode: "no-cors" }).catch(() => {});   // refresh the backup mirror too
    say("Published. Corps members will see the update within about 5 minutes.", "ok");
  } catch (e) {
    say("Couldn't publish. Your changes are still on this phone. Check your network and try again.", "err");
  } finally { btn.textContent = "Publish"; refreshBar(); }
}

window.addEventListener("beforeunload", e => { if (changes().length) { e.preventDefault(); e.returnValue = ""; } });

/* ── Views: sign in → dashboard, and the corps member view ── */
let view = "dashboard";
function setView(v){
  view = v;
  document.querySelectorAll("[data-view]").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  $("#edit").hidden = v !== "dashboard"; $("#corps").hidden = v !== "corps";
  if (v === "corps") {
    $("#pvmode").querySelector('[value="draft"]').disabled = !changes().length;
    if (!changes().length) $("#pvmode").value = "live";
    $("#pv").src = `../?preview=${$("#pvmode").value}&v=${Date.now()}`;
  }
  window.scrollTo({ top: 0 });
}
$("#pvmode").addEventListener("change", () => setView("corps"));

function route(){
  const signedIn = !!token && !!editor;
  if (!signedIn) {
    $("#dash").hidden = true; $("#login").hidden = false;
    $("#lname").value = editor; if (location.hash !== "#login") history.replaceState(null, "", "#login");
    return;
  }
  $("#login").hidden = true; $("#dash").hidden = false; setWho();
  if (location.hash !== "#dashboard") history.replaceState(null, "", "#dashboard");
}
window.addEventListener("hashchange", route);

$("#lgform").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("#lname").value.trim(), code = $("#lcode").value.trim();
  if (!name || !code) { say("Enter your full name and access code.", "err", "#lmsg"); return; }
  const btn = $("#signin"); btn.disabled = true; btn.textContent = "Signing in…"; say("", "info", "#lmsg");
  token = code; editor = name;
  const r = await connect();
  btn.disabled = false; btn.textContent = "Sign in";
  if (r !== "ok") {
    token = "";
    say(r === "denied" ? "That access code didn't work. Check it and try again, or contact the administrator for a new one."
                       : "Can't reach the server. Check your network and try again.", "err", "#lmsg");
    return;
  }
  store.set("camp-admin-name", editor);
  if ($("#lkeep").checked) { store.set("camp-admin-token", token); sess.del("camp-admin-token"); }
  else { sess.set("camp-admin-token", token); store.del("camp-admin-token"); }
  $("#lcode").value = ""; location.hash = "#dashboard"; route(); tab = "time"; render();
});

/* ── Installable as its own "Camp Admin" icon ── */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(() => {});

/* ── Start ── */
route();
if (token && editor) {
  render();
  connect().then(r => {
    if (r === "denied") { token = ""; store.del("camp-admin-token"); sess.del("camp-admin-token"); route(); say("Your access code no longer works. Contact the Camp Companion administrator for a new one.", "err", "#lmsg"); }
    else if (r === "offline") say("You're offline. You can keep editing, and publish when you have signal.", "info");
  });
}
</script>
</body>
