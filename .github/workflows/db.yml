# Applies new database migrations to Supabase whenever they land on main.
# Needs three repo secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF.
name: Database
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "${{ secrets.SUPABASE_PROJECT_REF }}" ]; then
            echo "::warning::Supabase secrets not set yet, skipping."; exit 0; fi
          echo "READY=1" >> $GITHUB_ENV
      - if: env.READY == '1'
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} -p "$SUPABASE_DB_PASSWORD"
      - if: env.READY == '1'
        run: supabase db push -p "$SUPABASE_DB_PASSWORD"
